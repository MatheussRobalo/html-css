    <style>
        body{
            font-family: sans-serif;

        }

        a{
            color: red;
            text-decoration: none;
            font-weight: bold;
            
        }

        a:visited{
            color: darkred;
        }

        a:hover{
            color: black;
            text-decoration: underline;
        }

        a:active{
            color: yellow;
        }

        a::after{
            content: '';
            text-decoration: none;
            font-weight: normal;
            color: darkgray;
        }
    </style>
</head>
