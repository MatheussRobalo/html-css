<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragrafos</title>
</head>
<body>
    <h1>Paragrafos e quebra de linha</h1>
    <hr>
    <p>Voce pode escrever um paragrafo de qualquer jeito, basta colocar tudo no meio do par de tags p e /p</p>
    <p>se precisar quebrar o texto em algum lugar especifico <br> como esse, voce pode usar a tag br </p>
    <p>adicionando simbolos especiais
        &reg;
        &copy;
        &trade;
        &euro;
    </p>
    <p>Adicionando emojis
        &#X2705
    </p>
</body>
</html>
